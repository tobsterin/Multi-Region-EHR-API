<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="440" viewBox="0 0 1200 440"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     role="img" aria-label="The federated read path across three zones separated by residency boundaries. In the requesting region a clinician in France holds only a French identifier. Crossing into the global zone, the master patient index returns the home region and patient UUID. Crossing again into the UK home region, the regional mapping table exchanges that UUID for a local patient id, and the clinical table is read with it. The record returns across both boundaries and is held in memory only. Designed but not yet live.">

  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1A2740" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="16" fill="#0B1220"/>
  <rect width="1200" height="440" rx="16" fill="url(#grid2)"/>
  <rect x="1" y="1" width="1198" height="438" rx="15" fill="none" stroke="#22314F" stroke-width="2"/>

  <!-- masthead -->
  <rect x="44" y="30" width="4" height="15" fill="#2DD4BF"/>
  <text x="58" y="42" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5">FEDERATED READ</text>
  <rect x="966" y="28" width="190" height="18" rx="3" fill="none" stroke="#F5A524"/>
  <text x="1061" y="41" text-anchor="middle" fill="#F5A524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1.4">DESIGNED · NOT YET LIVE</text>
  <path d="M44 60H1156" stroke="#1B2942" stroke-width="1.5"/>

  <!-- ============ residency boundaries ============ -->
  <path d="M300 68V326" stroke="#465877" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M576 68V326" stroke="#465877" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1.5" text-anchor="middle">
    <text x="162" y="80" fill="#7488A8">REQUESTING REGION · eu-west-3</text>
    <text x="438" y="80" fill="#7488A8">GLOBAL</text>
    <text x="866" y="80" fill="#7488A8">HOME REGION · eu-west-2</text>
  </g>

  <!-- step badges -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">
    <circle cx="334" cy="104" r="9" fill="#0B1220" stroke="#5B9CFF" stroke-width="1.5"/>
    <text x="334" y="108" text-anchor="middle" fill="#5B9CFF">1</text>
    <circle cx="610" cy="104" r="9" fill="#0B1220" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="610" y="108" text-anchor="middle" fill="#2DD4BF">2</text>
    <circle cx="886" cy="104" r="9" fill="#0B1220" stroke="#5B9CFF" stroke-width="1.5"/>
    <text x="886" y="108" text-anchor="middle" fill="#5B9CFF">3</text>
  </g>

  <!-- ============ A · requesting region ============ -->
  <g>
    <rect x="44" y="122" width="236" height="136" rx="10" fill="#111C31" stroke="#22314F" stroke-width="1.5"/>
    <text x="62" y="148" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CLINICIAN</text>
    <text x="262" y="148" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">fr</text>
    <path d="M62 160H262" stroke="#1B2942"/>
    <text x="62" y="182" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">HOLDS</text>
    <text x="62" y="224" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">WANTS</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.03;.06;.93;1" dur="12s" repeatCount="indefinite"/>
      <text x="62" y="202" fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">FR-2790475116334</text>
      <text x="62" y="244" fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">UK clinical history</text>
    </g>
  </g>

  <!-- ============ B · global MPI ============ -->
  <g>
    <rect x="320" y="122" width="236" height="136" rx="10" fill="#111C31" stroke="#22314F" stroke-width="1.5"/>
    <text x="338" y="148" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">GLOBAL MPI</text>
    <text x="538" y="148" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">replicated</text>
    <path d="M338 160H538" stroke="#1B2942"/>
    <text x="338" y="182" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">HOME REGION</text>
    <text x="338" y="224" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">PATIENT_UUID</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.17;.20;.93;1" dur="12s" repeatCount="indefinite"/>
      <text x="338" y="202" fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">uk · eu-west-2</text>
      <text x="338" y="244" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">7956c0ad…0c745</text>
    </g>
  </g>

  <!-- ============ C · the mapping table ============ -->
  <g>
    <rect x="596" y="122" width="236" height="136" rx="10" fill="#111C31" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="614" y="148" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">MAPPING TABLE</text>
    <text x="814" y="148" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">uk only</text>
    <path d="M614 160H814" stroke="#1B2942"/>
    <text x="614" y="182" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">LOOK UP</text>
    <text x="614" y="224" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">RETURNS LOCAL ID</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.32;.35;.93;1" dur="12s" repeatCount="indefinite"/>
      <text x="614" y="202" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">7956c0ad…0c745</text>
      <text x="614" y="244" fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">pat-uk-200</text>
    </g>
  </g>

  <!-- ============ D · UK clinical vault ============ -->
  <g>
    <rect x="872" y="122" width="284" height="136" rx="10" fill="#111C31" stroke="#22314F" stroke-width="1.5"/>
    <text x="890" y="148" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CLINICAL TABLE</text>
    <text x="1138" y="148" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">uk only</text>
    <path d="M890 160H1138" stroke="#1B2942"/>
    <text x="890" y="182" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">QUERY</text>
    <text x="890" y="224" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">RETURNS</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.47;.50;.93;1" dur="12s" repeatCount="indefinite"/>
      <text x="890" y="202" fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">PK = PATIENT#pat-uk-200</text>
      <text x="890" y="244" fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">encounters · observations</text>
    </g>
  </g>

  <!-- ============ connectors ============ -->
  <path id="ab" d="M280 190H312" fill="none" stroke="#5B9CFF" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;.10;.15;.93;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M312 185l8 5-8 5z" fill="#5B9CFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.14;.16;.93;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <path id="bc" d="M556 190H588" fill="none" stroke="#2DD4BF" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;.25;.30;.93;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M588 185l8 5-8 5z" fill="#2DD4BF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.29;.31;.93;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <path id="cd" d="M832 190H864" fill="none" stroke="#5B9CFF" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;.40;.45;.93;1" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M864 185l8 5-8 5z" fill="#5B9CFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.44;.46;.93;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- ============ 4 · the return, in memory only ============ -->
  <path id="ret" d="M1014 258V318H162V258" fill="none" stroke="#F5A524" stroke-width="2"
        stroke-dasharray="6 5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.56;.60;.93;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-22" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#F5A524" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;0;1;1" keyTimes="0;.56;.70;1">
      <mpath xlink:href="#ret" href="#ret"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.55;.57;.69;.71;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <path d="M167 266l-5-8-5 8z" fill="#F5A524" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.69;.71;.93;1" dur="12s" repeatCount="indefinite"/>
  </path>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.72;.75;.93;1" dur="12s" repeatCount="indefinite"/>
    <circle cx="524" cy="344" r="10" fill="#0B1220" stroke="#F5A524" stroke-width="1.5"/>
    <text x="524" y="348" text-anchor="middle" fill="#F5A524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">4</text>
    <text x="548" y="348" fill="#F5A524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">merged in memory · shown to the clinician · never written</text>
  </g>

  <!-- footer -->
  <text x="44" y="410" fill="#7488A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">the uuid crosses both boundaries · the local patient id never leaves the region that issued it</text>
  <text x="1156" y="410" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Multi-Region-EHR-API · §4 data flow</text>
</svg>
