<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="520" viewBox="0 0 1200 520"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="The planned federated read path. A clinician in France starts from the patient's French record. The hashed national ID resolves a patient UUID in the global master patient index, and an index on that UUID lists every region the identity is registered in: the UK, Germany and France. The UUID crosses the residency boundaries to each region. Each region exchanges it for its own local patient id in its mapping table, reads its clinical table and returns the records. The requesting region combines them in memory, labelled by region, and writes nothing. Designed but not yet live.">

  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1A2740" stroke-width="1" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="16" fill="#0B1220"/>
  <rect width="1200" height="520" rx="16" fill="url(#grid2)"/>
  <rect x="1" y="1" width="1198" height="518" rx="15" fill="none" stroke="#22314F" stroke-width="2"/>

  <!-- masthead -->
  <rect x="44" y="30" width="4" height="15" fill="#2DD4BF"/>
  <text x="58" y="42" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5">FEDERATED READ</text>
  <rect x="966" y="28" width="190" height="18" rx="3" fill="none" stroke="#F5A524"/>
  <text x="1061" y="41" text-anchor="middle" fill="#F5A524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1.4">DESIGNED · NOT YET LIVE</text>
  <path d="M44 60H1156" stroke="#1B2942" stroke-width="1.5"/>

  <!-- ============ residency boundaries ============ -->
  <path d="M44 195H1156" stroke="#465877" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M358 195V432" stroke="#465877" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M842 195V432" stroke="#465877" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="1156" y="187" text-anchor="end" fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" letter-spacing="1.5">RESIDENCY BOUNDARY</text>

  <!-- ============ global MPI ============ -->
  <g>
    <rect x="44" y="84" width="1112" height="88" rx="10" fill="#111C31" stroke="#22314F" stroke-width="1.5"/>
    <path d="M320 102V154M880 102V154" stroke="#1B2942"/>

    <text x="62" y="120" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">GLOBAL MPI</text>
    <text x="62" y="143" fill="#7488A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">hashes and uuids only</text>

    <g fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">
      <text x="338" y="120">GETITEM · HASHED NATIONAL ID</text>
      <text x="612" y="120">QUERY · PATIENT_UUID INDEX</text>
      <text x="898" y="120">REPLICATED TO</text>
    </g>
    <text x="898" y="143" fill="#7488A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">eu-west-2 · eu-central-1 · eu-west-3</text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.13;.16;.95;1" dur="16s" repeatCount="indefinite"/>
      <text x="338" y="144" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">7956c0ad…0c745</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.19;.22;.95;1" dur="16s" repeatCount="indefinite"/>
      <text x="612" y="144" fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">uk · de · fr</text>
    </g>
  </g>

  <!-- ============ UK ============ -->
  <g>
    <rect x="44" y="218" width="300" height="200" rx="10" fill="#111C31" stroke="#22314F" stroke-width="1.5"/>
    <text x="62" y="245" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">UK</text>
    <text x="326" y="245" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">eu-west-2</text>
    <path d="M62 257H326" stroke="#1B2942"/>
    <g fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">
      <text x="62" y="280">MAPPING TABLE</text>
      <text x="62" y="328">CLINICAL TABLE</text>
      <text x="62" y="376">RETURNS</text>
    </g>
    <g fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.39;.42;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="62" y="300"><tspan fill="#2DD4BF">7956c0ad…</tspan> → pat-uk-200</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.48;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="62" y="348">PK = PATIENT#pat-uk-200</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.51;.54;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="62" y="396" fill="#F5A524">encounters · observations</text>
      </g>
    </g>
  </g>

  <!-- ============ FR · the requesting region ============ -->
  <g>
    <rect x="372" y="218" width="456" height="200" rx="10" fill="#111C31" stroke="#5B9CFF" stroke-width="1.5"/>
    <text x="390" y="245" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">FR</text>
    <rect x="428" y="233" width="142" height="16" rx="3" fill="none" stroke="#5B9CFF"/>
    <text x="499" y="244.5" text-anchor="middle" fill="#5B9CFF" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.4">REQUESTING REGION</text>
    <text x="810" y="245" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">eu-west-3</text>
    <path d="M390 257H810" stroke="#1B2942"/>
    <path d="M602 270V402" stroke="#1B2942"/>
    <g fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">
      <text x="390" y="280">CLINICIAN STARTS FROM</text>
      <text x="390" y="328">ASKS FOR</text>
      <text x="390" y="376">OWN MAPPING TABLE</text>
      <text x="620" y="280">HISTORY · IN MEMORY ONLY</text>
      <text x="620" y="376">ANSWERED</text>
    </g>
    <g fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.02;.05;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="390" y="300">pat-fr-200</text>
        <text x="390" y="348">history · every region</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.39;.42;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="390" y="396"><tspan fill="#2DD4BF">7956c0ad…</tspan> → pat-fr-200</text>
      </g>

      <!-- the combined history, one line per region that answered -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.63;.65;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="620" y="300"><tspan fill="#F5A524">uk</tspan> · records</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.65;.67;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="620" y="322"><tspan fill="#F5A524">de</tspan> · records</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.67;.69;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="620" y="344"><tspan fill="#F5A524">fr</tspan> · records</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.71;.74;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="620" y="396">3 of 3 regions</text>
      </g>
    </g>
  </g>

  <!-- ============ DE ============ -->
  <g>
    <rect x="856" y="218" width="300" height="200" rx="10" fill="#111C31" stroke="#22314F" stroke-width="1.5"/>
    <text x="874" y="245" fill="#E7EEF9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">DE</text>
    <text x="1138" y="245" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">eu-central-1</text>
    <path d="M874 257H1138" stroke="#1B2942"/>
    <g fill="#465877" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.6">
      <text x="874" y="280">MAPPING TABLE</text>
      <text x="874" y="328">CLINICAL TABLE</text>
      <text x="874" y="376">RETURNS</text>
    </g>
    <g fill="#E7EEF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.39;.42;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="874" y="300"><tspan fill="#2DD4BF">7956c0ad…</tspan> → pat-de-200</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.48;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="874" y="348">PK = PATIENT#pat-de-200</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.51;.54;.95;1" dur="16s" repeatCount="indefinite"/>
        <text x="874" y="396" fill="#F5A524">encounters · observations</text>
      </g>
    </g>
  </g>

  <!-- ============ 1 · hashed national id up to the MPI ============ -->
  <path d="M438 218V180" fill="none" stroke="#5B9CFF" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;.08;.12;.95;1" dur="16s" repeatCount="indefinite"/>
  </path>
  <path d="M433 180l5-8 5 8z" fill="#5B9CFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.11;.13;.95;1" dur="16s" repeatCount="indefinite"/>
  </path>

  <!-- ============ 2 · the uuid and its regions come back ============ -->
  <path d="M706 172V210" fill="none" stroke="#2DD4BF" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;.24;.28;.95;1" dur="16s" repeatCount="indefinite"/>
  </path>
  <path d="M701 210l5 8 5-8z" fill="#2DD4BF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.27;.29;.95;1" dur="16s" repeatCount="indefinite"/>
  </path>

  <!-- ============ 3 · the uuid goes to every other region ============ -->
  <path d="M372 290H352" fill="none" stroke="#5B9CFF" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;.32;.36;.95;1" dur="16s" repeatCount="indefinite"/>
  </path>
  <path d="M352 285l-8 5 8 5z" fill="#5B9CFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.35;.37;.95;1" dur="16s" repeatCount="indefinite"/>
  </path>
  <path d="M828 290H848" fill="none" stroke="#5B9CFF" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0;1" keyTimes="0;.32;.36;.95;1" dur="16s" repeatCount="indefinite"/>
  </path>
  <path d="M848 285l8 5-8 5z" fill="#5B9CFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.35;.37;.95;1" dur="16s" repeatCount="indefinite"/>
  </path>

  <!-- ============ 4 · the records return, in memory only ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.57;.60;.95;1" dur="16s" repeatCount="indefinite"/>
    <path d="M344 386H364" fill="none" stroke="#F5A524" stroke-width="2" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M364 381l8 5-8 5z" fill="#F5A524"/>
    <path d="M856 386H836" fill="none" stroke="#F5A524" stroke-width="2" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M836 381l-8 5 8 5z" fill="#F5A524"/>
  </g>

  <!-- step badges, on the boundaries they cross -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="414" cy="195" r="9" fill="#0B1220" stroke="#5B9CFF" stroke-width="1.5"/>
    <text x="414" y="199" fill="#5B9CFF">1</text>
    <circle cx="730" cy="195" r="9" fill="#0B1220" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="730" y="199" fill="#2DD4BF">2</text>
    <circle cx="358" cy="264" r="9" fill="#0B1220" stroke="#5B9CFF" stroke-width="1.5"/>
    <text x="358" y="268" fill="#5B9CFF">3</text>
    <circle cx="842" cy="264" r="9" fill="#0B1220" stroke="#5B9CFF" stroke-width="1.5"/>
    <text x="842" y="268" fill="#5B9CFF">3</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.75;.78;.95;1" dur="16s" repeatCount="indefinite"/>
    <circle cx="290" cy="452" r="10" fill="#0B1220" stroke="#F5A524" stroke-width="1.5"/>
    <text x="290" y="456" text-anchor="middle" fill="#F5A524" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">4</text>
    <text x="314" y="456" fill="#F5A524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">combined in memory · labelled by region · a silent region is flagged · never written</text>
  </g>

  <!-- footer -->
  <text x="44" y="492" fill="#7488A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">the uuid crosses the boundaries · local patient ids never leave the region that issued them</text>
  <text x="1156" y="492" text-anchor="end" fill="#465877" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Multi-Region-EHR-API · §7 data flow</text>
</svg>
